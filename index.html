<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#6ccbf2">
<title>FACE FLAPPY DELUXE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151b;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{display:grid;place-items:center}
#game{position:relative;width:min(100vw,560px);height:min(100vh,900px);height:min(100svh,900px);overflow:hidden;background:#72cdf1;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;z-index:5;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.score{font-size:52px;line-height:1;font-weight:950;color:#fff;text-shadow:0 4px 0 #0007}
.pill{background:#ffffffdf;color:#183247;padding:8px 12px;border-radius:999px;font-size:11px;font-weight:900}
#menu{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#07152233}
.card{width:min(94%,410px);padding:27px;border-radius:28px;background:rgba(255,255,255,.96);color:#173047;text-align:center;box-shadow:0 25px 90px #0007}
h1{margin:0;font-size:38px;letter-spacing:-1px}
h2{font-size:16px;margin:18px 0 8px}
p{color:#607582;line-height:1.45;margin:8px 0 18px}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
button,select,input{font:inherit}
button{border:0;border-radius:14px;min-height:48px;padding:11px 19px;background:#173047;color:#fff;font-weight:900;cursor:pointer}
button.alt{background:#e8eff2;color:#173047}
#settings{margin-top:14px;background:#edf4f7;border-radius:16px;padding:14px;text-align:left}
label{display:block;font-size:13px;font-weight:850;margin:8px 0}
select{width:100%;padding:10px;border:1px solid #b7c6ce;border-radius:10px;background:#fff}
input[type=range]{width:100%}
.hidden{display:none!important}
.small{font-size:12px;color:#71818a;margin-top:12px}
#bottom{position:absolute;z-index:8;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}
#bottom button{min-height:40px;padding:8px 12px;font-size:12px;background:#ffffffdd;color:#173047}
#loading{position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:#08141ee8;color:#fff;font-weight:900}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div id="loading">Loading FACE FLAPPY…</div>
<div id="hud"><span class="pill">TAP • CLICK • SPACE</span><span id="score" class="score">0</span></div>

<div id="menu">
<div class="card">
<h1 id="title">FACE FLAPPY</h1>
<p id="message">A polished arcade flight game with your face as the pilot.</p>
<div id="stats"></div>
<div class="row"><button id="play">PLAY</button><button id="settingsBtn" class="alt">SETTINGS</button></div>
<div id="settings" class="hidden">
<label>Speed / Difficulty</label>
<select id="difficulty">
<option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option><option value="extreme">Extreme</option><option value="custom">Custom</option>
</select>
<div id="custom" class="hidden">
<label>Speed: <span id="speedText">180</span></label>
<input id="speed" type="range" min="135" max="285" value="180">
</div>
<h2>Scenes</h2>
<label><select id="scene"><option value="auto" selected>Dynamic scenes</option><option value="day">Sunny Valley</option><option value="sunset">Sunset Mountains</option><option value="night">Neon Night</option><option value="storm">Storm Sky</option></select></label>
<div class="small">Pipe gap and spacing remain comfortable and consistent. Difficulty changes speed only.</div>
</div>
<div class="small">Best: <b id="best">0</b></div>
</div>
</div>

<div id="bottom"><button id="pause">PAUSE</button><button id="sound">🔊 SOUND</button><button id="restart">RESTART</button></div>

<script>
(()=>{"use strict";

const FACE_LOCAL="face.png";
const FACE_REMOTE="https://i.postimg.cc/x1sVGJHm/1000207247-removebg-preview.png";
const speeds={easy:145,normal:180,hard:220,extreme:260};
const G={gap:194,spacing:250,pipeW:78,ground:84,gravity:920,jump:-345};

const root=document.getElementById("game"),cv=document.getElementById("canvas"),ctx=cv.getContext("2d");
const menu=document.getElementById("menu"),loading=document.getElementById("loading");
const play=document.getElementById("play"),settingsBtn=document.getElementById("settingsBtn"),settings=document.getElementById("settings");
const difficulty=document.getElementById("difficulty"),custom=document.getElementById("custom"),speed=document.getElementById("speed"),speedText=document.getElementById("speedText"),sceneSel=document.getElementById("scene");
const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),title=document.getElementById("title"),message=document.getElementById("message"),stats=document.getElementById("stats");
const pause=document.getElementById("pause"),sound=document.getElementById("sound"),restart=document.getElementById("restart");

const face=new Image();
face.decoding="async";
let faceUsingRemote=false;
face.src=FACE_LOCAL;

/* Supplied audio assets:
   - background track.m4a = continuous looping background music
   - hit.mp3 = obstacle/ground collision sound
*/
const bgMusic=new Audio("background track.m4a");
bgMusic.preload="auto";
bgMusic.loop=true;
bgMusic.volume=.48;

const hitAudio=new Audio("hit.mp3");
hitAudio.preload="auto";
hitAudio.volume=1;

let W=480,H=800,dpr=1,state="menu",raf=0,last=0,score=0;
let best=+(localStorage.getItem("ffBest")||0);
let pipes=[],spawn=0,muted=false,bird,sceneIndex=0,world=0;

/* Real supplied background track replaces the previous in-code synth. */
let musicRunning=false;
function startMusic(){
  if(muted||musicRunning)return;
  musicRunning=true;
  bgMusic.play().catch(()=>{});
}
function stopMusic(){
  musicRunning=false;
  bgMusic.pause();
  bgMusic.currentTime=0;
}
function suspendMusic(){
  if(musicRunning)bgMusic.pause();
}
function resumeMusic(){
  if(muted||!musicRunning)return;
  bgMusic.play().catch(()=>{});
}

function resize(){
  const r=root.getBoundingClientRect();
  W=480;
  H=Math.max(680,Math.min(900,Math.round(W*r.height/Math.max(1,r.width))));
  dpr=Math.min(2,devicePixelRatio||1);
  cv.width=W*dpr;
  cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);
resize();

bestEl.textContent=best;
difficulty.value=localStorage.getItem("ffDiff")||"normal";
speed.value=localStorage.getItem("ffSpeed")||"180";
speedText.textContent=speed.value;
sceneSel.value=localStorage.getItem("ffScene")||"auto";

function speedNow(){
  return difficulty.value==="custom"?+speed.value:speeds[difficulty.value];
}
function save(){
  localStorage.setItem("ffBest",best);
  localStorage.setItem("ffDiff",difficulty.value);
  localStorage.setItem("ffSpeed",speed.value);
  localStorage.setItem("ffScene",sceneSel.value);
}
function sfx(n){
  if(muted)return;
  if(n===3||n===4){
    hitAudio.currentTime=0;
    hitAudio.play().catch(()=>{});
  }
}

function reset(){
  bird={x:112,y:H*.46,vy:0,angle:0,bank:0};
  pipes=[];
  score=0;
  spawn=.8;
  world=0;
  scoreEl.textContent="0";
  sceneIndex=sceneSel.value==="auto"
    ?Math.floor(Math.random()*4)
    :["day","sunset","night","storm"].indexOf(sceneSel.value);
  if(sceneIndex<0)sceneIndex=0;
}

function start(){
  stopMusic();
  reset();
  state="playing";
  pause.textContent="PAUSE";
  menu.classList.add("hidden");
  last=performance.now();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
  startMusic();
  jump();
}

function jump(){
  if(state==="menu"||state==="gameover"){
    start();
    return;
  }
  if(state!=="playing")return;
  bird.vy=G.jump;
  bird.bank=-.12;
  sfx(1);
}

function addPipe(){
  const playable=H-G.ground,margin=110;
  const min=margin,max=Math.max(min,playable-margin-G.gap);
  pipes.push({
    x:W+35,
    top:min+Math.random()*(max-min),
    passed:false,
    seed:Math.random()
  });
}

function hit(cx,cy,r,x,y,w,h){
  const qx=Math.max(x,Math.min(cx,x+w));
  const qy=Math.max(y,Math.min(cy,y+h));
  const dx=cx-qx,dy=cy-qy;
  return dx*dx+dy*dy<r*r;
}

function die(){
  if(state!=="playing")return;
  state="gameover";
  stopMusic();
  sfx(3);

  if(score>best){
    best=score;
    save();
  }

  title.textContent="FLIGHT ENDED";
  message.textContent="Score "+score+" • Best "+best;
  stats.innerHTML=score===best&&score>0?"🏆 NEW HIGH SCORE!":"";
  play.textContent="FLY AGAIN";
  bestEl.textContent=best;
  menu.classList.remove("hidden");
}

function update(dt){
  const v=speedNow();
  world+=v*dt;

  bird.vy+=G.gravity*dt;
  bird.y+=bird.vy*dt;
  bird.angle=Math.max(-.35,Math.min(.85,bird.vy/560));
  bird.bank+=(Math.max(-.15,Math.min(.12,-bird.vy/300))-bird.bank)*Math.min(1,dt*5);

  spawn-=dt;
  if(spawn<=0){
    addPipe();
    spawn=G.spacing/v;
  }

  for(const p of pipes){
    p.x-=v*dt;
    if(!p.passed&&p.x+G.pipeW<bird.x){
      p.passed=true;
      score++;
      scoreEl.textContent=score;
      sfx(2);
    }
  }
  pipes=pipes.filter(p=>p.x>-120);

  const r=21;
  if(bird.y-r<0||bird.y+r>H-G.ground){
    die();
    return;
  }

  for(const p of pipes){
    if(
      hit(bird.x,bird.y,r,p.x,0,G.pipeW,p.top) ||
      hit(bird.x,bird.y,r,p.x,p.top+G.gap,G.pipeW,H-G.ground-p.top-G.gap)
    ){
      die();
      return;
    }
  }
}

function canopyLayer(speedFactor,color,height,groundY){
  ctx.fillStyle=color;
  const period=150;
  for(let i=-1;i<Math.ceil(W/period)+2;i++){
    const x=i*period-((world*speedFactor)%period);
    ctx.beginPath();
    ctx.moveTo(x,groundY);
    ctx.quadraticCurveTo(x+period*.25,groundY-height,x+period*.5,groundY-height*.65);
    ctx.quadraticCurveTo(x+period*.75,groundY-height*1.05,x+period,groundY-height*.5);
    ctx.quadraticCurveTo(x+period*1.15,groundY-height*.2,x+period*1.3,groundY);
    ctx.closePath();
    ctx.fill();
  }
}

function fireflies(count,alphaBase){
  ctx.fillStyle="#eaff7a";
  for(let i=0;i<count;i++){
    const x=(i*97+world*.05)%W;
    const y=(H-G.ground)*.5+((i*53)%160)-80+Math.sin(world*.002+i)*14;
    const a=alphaBase*(.4+.6*Math.abs(Math.sin(world*.004+i*1.7)));
    ctx.globalAlpha=a;
    ctx.beginPath();
    ctx.arc(x,y,2.4,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function birds(){
  ctx.strokeStyle="#183d32aa";
  ctx.lineWidth=2;
  for(let i=0;i<4;i++){
    const x=((i*170-world*.22)%700+700)%700-50;
    const y=100+(i%3)*55;
    ctx.beginPath();
    ctx.arc(x,y,9,Math.PI*.1,Math.PI*.85);
    ctx.arc(x+18,y,9,Math.PI*.15,Math.PI*.9);
    ctx.stroke();
  }
}

function sky(){
  let mode=sceneIndex;
  if(sceneSel.value==="auto")mode=Math.floor((score/8)%4);

  if(mode===0){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#66c9ed");
    g.addColorStop(.55,"#bdebd5");
    g.addColorStop(1,"#e9f7d6");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H-G.ground);

    ctx.fillStyle="#fff6b888";
    ctx.beginPath();
    ctx.arc(W*.78,105,72,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fffbd7";
    ctx.beginPath();
    ctx.arc(W*.78,105,43,0,Math.PI*2);
    ctx.fill();

    canopyLayer(.08,"#9bcf69",155,H-G.ground);
    canopyLayer(.16,"#65a94b",105,H-G.ground);
    canopyLayer(.25,"#397d3e",55,H-G.ground);
    birds();
  }else if(mode===1){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#4b376d");
    g.addColorStop(.45,"#dc705f");
    g.addColorStop(1,"#ffcb75");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H-G.ground);

    ctx.fillStyle="#ffb36a99";
    ctx.beginPath();
    ctx.arc(W*.52,H-G.ground-35,88,0,Math.PI*2);
    ctx.fill();

    canopyLayer(.08,"#49344a",150,H-G.ground);
    canopyLayer(.17,"#29203a",105,H-G.ground);
    canopyLayer(.27,"#171a2b",55,H-G.ground);
    fireflies(7,.45);
  }else if(mode===2){
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#040b19");
    g.addColorStop(1,"#173b4e");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H-G.ground);

    ctx.fillStyle="#eef5d6cc";
    ctx.beginPath();
    ctx.arc(W*.22,90,38,0,Math.PI*2);
    ctx.fill();

    for(let i=0;i<42;i++){
      const x=(i*83)%W;
      const y=(i*47)%420+30;
      ctx.globalAlpha=.35+((i*31)%55)/100;
      ctx.fillStyle="#eaf7ff";
      ctx.fillRect(x,y,2,2);
    }
    ctx.globalAlpha=1;

    canopyLayer(.10,"#173923",160,H-G.ground);
    canopyLayer(.20,"#0b2114",108,H-G.ground);
    canopyLayer(.30,"#07140d",58,H-G.ground);
    fireflies(12,.8);
  }else{
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#354b58");
    g.addColorStop(1,"#82978b");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H-G.ground);

    canopyLayer(.10,"#263c2c",160,H-G.ground);
    canopyLayer(.19,"#17291d",110,H-G.ground);
    canopyLayer(.28,"#0e1d14",60,H-G.ground);

    ctx.strokeStyle="#dff7ff66";
    ctx.lineWidth=2;
    for(let i=0;i<55;i++){
      const x=(i*43+world*.8)%W;
      const y=(i*67)%520;
      ctx.beginPath();
      ctx.moveTo(x,y);
      ctx.lineTo(x-14,y+35);
      ctx.stroke();
    }

    /* Rare lightning flash */
    if(Math.random()<.012){
      ctx.fillStyle="#ffffff55";
      ctx.fillRect(0,0,W,H-G.ground);
    }
  }
}

function leafCluster(cx,cy,seed,dir){
  ctx.fillStyle="#3f7d34";
  for(let i=0;i<3;i++){
    const a=(seed*97+i*2.1)%1;
    const ang=(a-.5)*1.6;
    const len=14+(seed*53%10);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(len*.5,dir*6,len,0);
    ctx.quadraticCurveTo(len*.5,-dir*6,0,0);
    ctx.fill();
    ctx.restore();
  }
}

function vine(cx,cy,seed){
  const len=24+(seed*37%16);
  ctx.strokeStyle="#3a5d24";
  ctx.lineWidth=2;
  const midX=cx+((seed*13)%10-5);
  const endX=cx+((seed*7)%8-4);
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.quadraticCurveTo(midX,cy+len*.5,endX,cy+len);
  ctx.stroke();

  ctx.fillStyle="#4a8a34";
  ctx.beginPath();
  ctx.ellipse(endX,cy+len,6,9,.3,0,Math.PI*2);
  ctx.fill();
}

function bamboo(p){
  const x=p.x,w=G.pipeW;
  const rnd=p.seed;
  const topH=p.top;
  const botY=p.top+G.gap;
  const botH=H-G.ground-botY;

  const grad=ctx.createLinearGradient(x,0,x+w,0);
  grad.addColorStop(0,"#557b2c");
  grad.addColorStop(.18,"#9fc957");
  grad.addColorStop(.48,"#d2df75");
  grad.addColorStop(.75,"#8cad46");
  grad.addColorStop(1,"#3d6528");

  ctx.fillStyle=grad;
  ctx.fillRect(x,0,w,topH);
  ctx.fillRect(x,botY,w,botH);

  ctx.strokeStyle="#5d722d88";
  ctx.lineWidth=3;
  for(let ry=30;ry<topH;ry+=38){
    ctx.beginPath();
    ctx.moveTo(x+2,ry);
    ctx.lineTo(x+w-2,ry);
    ctx.stroke();
  }
  for(let ry=botY+30;ry<botY+botH;ry+=38){
    ctx.beginPath();
    ctx.moveTo(x+2,ry);
    ctx.lineTo(x+w-2,ry);
    ctx.stroke();
  }

  /* Bamboo caps / nodes */
  ctx.fillStyle="#6f9137";
  ctx.fillRect(x-8,Math.max(0,topH-23),w+16,23);
  ctx.fillRect(x-8,botY,w+16,23);

  ctx.strokeStyle="#3e5925";
  ctx.lineWidth=3;
  ctx.strokeRect(x-8,Math.max(0,topH-23),w+16,23);
  ctx.strokeRect(x-8,botY,w+16,23);

  ctx.fillStyle="#d6e985";
  ctx.fillRect(x+11,0,7,Math.max(0,topH-23));
  ctx.fillRect(x+11,botY+23,7,Math.max(0,botH-23));

  leafCluster(x+w*.12,topH-18,rnd,-1);
  leafCluster(x+w*.78,topH-12,rnd*1.7,-1);
  leafCluster(x+w*.2,botY+24,rnd*2.3,1);
  leafCluster(x+w*.8,botY+18,rnd*3.1,1);
  vine(x+w*.35,topH,rnd*5.2);
  vine(x+w*.65,topH,rnd*8.4);
}

function ground(){
  const y=H-G.ground;

  ctx.fillStyle="#563b24";
  ctx.fillRect(0,y,W,G.ground);

  ctx.fillStyle="#2f6e32";
  ctx.fillRect(0,y,W,15);

  ctx.fillStyle="#5d8f3a";
  for(let x=-(world%28);x<W;x+=28){
    ctx.beginPath();
    ctx.moveTo(x,y+15);
    ctx.lineTo(x+7,y+2);
    ctx.lineTo(x+14,y+15);
    ctx.fill();
  }

  /* Soil bands */
  ctx.fillStyle="#704927";
  ctx.fillRect(0,y+15,W,G.ground-15);

  ctx.fillStyle="#8b6337";
  for(let x=-(world*.55%50);x<W;x+=50){
    ctx.beginPath();
    ctx.ellipse(x+18,y+40+(x%19),9,5,.4,0,Math.PI*2);
    ctx.fill();
  }

  /* Hanging roots */
  ctx.strokeStyle="#392718";
  ctx.lineWidth=3;
  for(let x=-(world*.6%42);x<W;x+=42){
    ctx.beginPath();
    ctx.moveTo(x,y+13);
    ctx.quadraticCurveTo(x+9,y+31,x+4,y+G.ground);
    ctx.stroke();
  }

  /* Fallen leaves */
  ctx.fillStyle="#b96d31";
  for(let x=-(world*.35%75);x<W;x+=75){
    ctx.save();
    ctx.translate(x+25,y+55+(x%11));
    ctx.rotate(.5);
    ctx.beginPath();
    ctx.ellipse(0,0,8,4,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  /* Grass tufts */
  ctx.strokeStyle="#8bc64b";
  ctx.lineWidth=2;
  for(let x=-(world%34);x<W;x+=34){
    ctx.beginPath();
    ctx.moveTo(x,y+13);
    ctx.lineTo(x+5,y+3);
    ctx.moveTo(x+7,y+13);
    ctx.lineTo(x+12,y+5);
    ctx.stroke();
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  sky();

  for(const p of pipes)bamboo(p);
  ground();

  if(bird&&face.complete&&face.naturalWidth){
    ctx.save();
    ctx.translate(bird.x,bird.y);
    ctx.rotate(bird.angle+bird.bank);

    const max=68;
    const ratio=face.naturalWidth/face.naturalHeight;
    let w=max,h=max;
    if(ratio>1)h=max/ratio;
    else w=max*ratio;

    ctx.imageSmoothingEnabled=true;
    ctx.drawImage(face,-w/2,-h/2,w,h);
    ctx.restore();
  }else if(bird){
    ctx.fillStyle="#f3bd43";
    ctx.beginPath();
    ctx.arc(bird.x,bird.y,28,0,Math.PI*2);
    ctx.fill();
  }
}

function loop(t){
  if(state!=="playing")return;
  const dt=Math.min(.02,(t-last)/1000);
  last=t;
  update(dt);
  draw();
  if(state==="playing")raf=requestAnimationFrame(loop);
}

function pauseGame(){
  if(state==="playing"){
    state="paused";
    pause.textContent="RESUME";
    cancelAnimationFrame(raf);
    suspendMusic();
  }else if(state==="paused"){
    state="playing";
    pause.textContent="PAUSE";
    last=performance.now();
    raf=requestAnimationFrame(loop);
    resumeMusic();
  }
}

cv.addEventListener("pointerdown",e=>{
  e.preventDefault();
  jump();
},{passive:false});

root.addEventListener("keydown",e=>{
  if(e.code==="Space"||e.code==="ArrowUp"){
    e.preventDefault();
    jump();
  }
  if(e.code==="KeyP")pauseGame();
});

play.onclick=start;
restart.onclick=start;
pause.onclick=pauseGame;

sound.onclick=()=>{
  muted=!muted;
  sound.textContent=muted?"🔇 SOUND":"🔊 SOUND";
  if(muted){
    suspendMusic();
    hitAudio.pause();
  }else if(state==="playing"){
    resumeMusic();
  }
};

settingsBtn.onclick=()=>{
  settings.classList.toggle("hidden");
  custom.classList.toggle("hidden",difficulty.value!=="custom");
};

difficulty.onchange=()=>{
  custom.classList.toggle("hidden",difficulty.value!=="custom");
  save();
};

speed.oninput=()=>{
  speedText.textContent=speed.value;
  save();
};

sceneSel.onchange=save;

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    if(state==="playing")pauseGame();
  }
});

face.onload=()=>loading.classList.add("hidden");
face.onerror=()=>{
  if(!faceUsingRemote){
    faceUsingRemote=true;
    loading.textContent="Loading face image…";
    face.src=FACE_REMOTE;
    return;
  }
  loading.textContent="Face image could not be loaded. Check your internet connection.";
  loading.style.background="#401010";
};

reset();
draw();

})();
</script>
</div>
</body>
</html>
